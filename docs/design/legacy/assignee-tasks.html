            display: none;
            position: absolute;
            z-index: 50;
            min-width: 100%;
            max-height: 250px;
            overflow-y: auto;
            background-color: white;
            border: 1px solid #e5e7eb;

            background-color: #f8fafc;
        }
        
        .draggable-row:active {
            cursor: grabbing;
        }
        
        .dragging {
            opacity: 0.5;
            transform: rotate(2deg);
            z-index: 1000;
        }
        
        .drop-zone {
            background-color: #e3f2fd !important;
            border-top: 2px solid #2196f3;
        }
        
        .drop-zone-bottom {
            background-color: #e3f2fd !important;
            border-bottom: 2px solid #2196f3;
        }
        
        .drag-handle {
            cursor: grab;
            color: #9ca3af;
            padding: 4px;
        }
        
        .drag-handle:hover {
            color: #6b7280;
        }
        
        .drag-handle:active {
            cursor: grabbing;
        }
    </style>
</head>

<script>
// --- Sidebar ---
function toggleSubmenu(submenuId) {
    const submenu = document.getElementById(submenuId);
    const arrow = document.getElementById(submenuId + '-arrow');
    if (submenu.style.maxHeight && submenu.style.maxHeight !== '0px') {
        submenu.style.maxHeight = '0px';
        arrow.classList.remove('rotate-180');
    } else {
        submenu.style.maxHeight = submenu.scrollHeight + 'px';
        arrow.classList.add('rotate-180');
    }
}

// --- Enhanced Mock Data ---
const mockData = {

        { id: 11, code: 'MBAP-T-11', description: 'User authentication flow', assigneeId: 1, departmentId: 1, storyPoints: 6, status: 'todo', dependency: 3, priority: 'high', order: 11 },

        { id: 18, code: 'MBAP-T-18', description: 'Automated testing suite', assigneeId: 4, departmentId: 3, storyPoints: 9, status: 'todo', dependency: 4, priority: 'high', order: 18 },

// Color mappings
const priorityColors = { high: 'red', medium: 'orange', low: 'green' };
const statusColors = { todo: 'gray', in_progress: 'blue', done: 'green', closed: 'red' };
const colorClasses = {
    red: { bg: 'bg-red-100', text: 'text-red-700' },
    orange: { bg: 'bg-orange-100', text: 'text-orange-700' },
    green: { bg: 'bg-green-100', text: 'text-green-700' },
    blue: { bg: 'bg-blue-100', text: 'text-blue-700' },
    gray: { bg: 'bg-gray-100', text: 'text-gray-700' }
};

// Helper function to get badge HTML
function getBadge(type, id) {
    const item = type === 'status' ? mockData.statuses.find(s => s.id === id) : mockData.priorities.find(p => p.id === id);
    if (!item) return `<span class="priority-badge bg-gray-100 text-gray-700">-</span>`;
    
    const color = type === 'status' ? statusColors[id] : priorityColors[id];
    const classes = colorClasses[color];
    return `<span class="${type}-badge ${classes.bg} ${classes.text}">${item.name}</span>`;
}

// --- Drag and Drop Functions ---
let draggedElement = null;
let draggedTaskId = null;

function handleDragStart(e) {
    draggedElement = e.target.closest('tr');
    draggedTaskId = parseInt(draggedElement.dataset.taskId);
    draggedElement.classList.add('dragging');
    
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/html', draggedElement.outerHTML);
}

function handleDragOver(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    
    const afterElement = getDragAfterElement(e.target.closest('tbody'), e.clientY);
    const dragging = document.querySelector('.dragging');
    
    if (afterElement == null) {
        e.target.closest('tbody').appendChild(dragging);
    } else {
        e.target.closest('tbody').insertBefore(dragging, afterElement);
    }
}

function handleDragEnd(e) {
    e.target.classList.remove('dragging');
    draggedElement = null;
    draggedTaskId = null;
    
    // Remove all drop zone highlights
    document.querySelectorAll('.drop-zone, .drop-zone-bottom').forEach(el => {
        el.classList.remove('drop-zone', 'drop-zone-bottom');
    });
}

function handleDrop(e) {
    e.preventDefault();
    
    if (draggedTaskId) {
        updateTaskOrder();
    }
}

function getDragAfterElement(container, y) {
    const draggableElements = [...container.querySelectorAll('tr:not(.dragging)')];
    
    return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        
        if (offset < 0 && offset > closest.offset) {
            return { offset: offset, element: child };
        } else {
            return closest;
        }
    }, { offset: Number.NEGATIVE_INFINITY }).element;
}

function updateTaskOrder() {
    const tbody = document.querySelector('#assignee-tasks-container tbody');
    const rows = Array.from(tbody.querySelectorAll('tr'));
    
    // Update order numbers based on current row positions
    rows.forEach((row, index) => {
        const taskId = parseInt(row.dataset.taskId);
        const task = mockData.tasks.find(t => t.id === taskId);
        if (task) {
            task.order = index + 1;
        }
    });
    
    // Re-render the table to show updated order numbers
    renderTasks();
}

let selectedAssigneeId = mockData.assignees[0].id; // Default to the first assignee

// --- Filter Dropdown Logic ---
function filterAssigneeDropdownOptions(event) {
    const input = event.target;
    const filter = input.value.toUpperCase();
    const panel = input.closest('.custom-dropdown-panel');
    const ul = panel.querySelector('ul');
    const items = ul.getElementsByTagName('li');
    for (let i = 0; i < items.length; i++) {
        const item = items[i];
        const txtValue = item.textContent || item.innerText;
        item.style.display = txtValue.toUpperCase().indexOf(filter) > -1 ? '' : 'none';
    }
}

function buildAssigneeFilterDropdown() {
    const items = mockData.assignees;
    const selectedItem = items.find(i => i.id == selectedAssigneeId);
    const triggerText = selectedItem ? selectedItem.name : 'Select Assignee';
    
    const searchInputHTML = `<div class="p-2 border-b border-gray-200"><input type="text" class="w-full px-2 py-1 border border-gray-300 rounded-md text-sm" placeholder="Search..." onkeyup="filterAssigneeDropdownOptions(event)"></div>`;
    const options = items.map(item => `<li class="custom-dropdown-option" onclick="handleAssigneeSelect(${item.id})">${item.name}</li>`).join('');

    return (
        `<div class="relative" id="filter-dropdown-assignee">
            <div class="dropdown-trigger flex items-center justify-between w-64 bg-white border border-gray-300 rounded-md shadow-sm px-3 py-1.5 text-sm cursor-pointer" onclick="toggleFilterDropdown(event, this)">
                <span class="truncate">${triggerText}</span>
                <i class="fa-solid fa-chevron-down text-xs text-gray-400 ml-2"></i>
            </div>
            <div class="custom-dropdown-panel">
                ${searchInputHTML}
                <ul>
                    ${options}
                </ul>
            </div>
        </div>`
    );
}

function handleAssigneeSelect(assigneeId) {
    selectedAssigneeId = assigneeId;
    document.querySelector('#filter-dropdown-assignee .truncate').textContent = mockData.assignees.find(a => a.id == assigneeId).name;
    closeAllFilterDropdowns();
    renderPage();
}

function toggleFilterDropdown(event, trigger) {
    event.stopPropagation();
    const panel = trigger.nextElementSibling;
    const isShowing = panel.classList.contains('show');
    closeAllFilterDropdowns();
    if (!isShowing) {
        panel.classList.add('show');
        const searchInput = panel.querySelector('input[type="text"]');
        if (searchInput) {
            searchInput.value = '';
            searchInput.dispatchEvent(new KeyboardEvent('keyup', { 'key': '' }));
            searchInput.focus();
        }
    }
}

function closeAllFilterDropdowns() {
    document.querySelectorAll('#assignee-filter-container .custom-dropdown-panel.show').forEach(panel => panel.classList.remove('show'));
}

function initializeAssigneeFilter() {
    const container = document.getElementById('assignee-filter-container');
    if (!container) return;
    const assigneeDropdown = buildAssigneeFilterDropdown();
    container.innerHTML = assigneeDropdown;
}

// --- Calculation and Rendering ---
function renderPage() {
    renderSummary();
    renderTasks();
}

function renderSummary() {
    const container = document.getElementById('assignee-summary-container');
    if (!container) return;

    const assignee = mockData.assignees.find(a => a.id === selectedAssigneeId);
    if (!assignee) return;

    const sprint = mockData.sprintInfo;
    
    // 1. Total Capacity in Story Points
    const totalCapacity = sprint.totalWorkDays * sprint.storyPointPerDay;
    
    // 2. Total Capacity Left
    const tasksForAssignee = mockData.tasks.filter(t => t.assigneeId === selectedAssigneeId && t.status !== 'closed');
    const totalAssignedStoryPoints = tasksForAssignee.reduce((sum, task) => sum + task.storyPoints, 0);
    const totalCapacityLeft = totalCapacity - totalAssignedStoryPoints;

    container.innerHTML = `
        <div class="bg-white rounded-xl shadow-sm p-5">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">${assignee.name} - Sprint Summary</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-center">
                <div class="bg-blue-100 p-4 rounded-lg">
                    <p class="text-sm text-blue-700 font-medium">Total Capacity</p>
                    <p class="text-2xl font-bold text-blue-900">${totalCapacity} SP</p>
                </div>
                <div class="bg-green-100 p-4 rounded-lg">
                    <p class="text-sm text-green-700 font-medium">Total Capacity Left</p>
                    <p class="text-2xl font-bold text-green-900">${totalCapacityLeft} SP</p>
                </div>
            </div>
        </div>
    `;
}

function renderTasks() {
    const container = document.getElementById('assignee-tasks-container');
    if (!container) return;

    const tasksForAssignee = mockData.tasks.filter(t => t.assigneeId === selectedAssigneeId && t.status !== 'closed');
    const sprint = mockData.sprintInfo;

    if (tasksForAssignee.length === 0) {
        container.innerHTML = '<div class="bg-white rounded-xl shadow-sm p-5 text-center text-gray-500">No tasks assigned to this assignee.</div>';
        return;
    }

    // Sort tasks by order (user-defined execution order)
    const sortedTasks = tasksForAssignee.sort((a, b) => a.order - b.order);

    const taskRows = sortedTasks.map(task => {
        const dependencyTask = task.dependency ? mockData.tasks.find(t => t.id === task.dependency) : null;
        const daysSpent = (task.storyPoints / sprint.storyPointPerDay).toFixed(1);
        const dependencyCode = dependencyTask ? dependencyTask.code : 'None';
        
        return `
            <tr class="border-b draggable-row" data-task-id="${task.id}" draggable="true">
                <td class="p-3 text-center">
                    <div class="flex items-center justify-center">
                        <i class="fa-solid fa-grip-vertical drag-handle mr-2"></i>
                        <span class="font-medium text-gray-700">${task.order}</span>
                    </div>
                </td>
                <td class="p-3">${task.code}</td>
                <td class="p-3">${dependencyCode}</td>
                <td class="p-3">${task.description}</td>
                <td class="p-3 text-center">${getBadge('priority', task.priority)}</td>
                <td class="p-3 text-center">${getBadge('status', task.status)}</td>
                <td class="p-3 text-center">${task.storyPoints}</td>
                <td class="p-3 text-center">${daysSpent}</td>
            </tr>
        `;
    }).join('');

    container.innerHTML = `
        <div class="bg-white rounded-xl shadow-sm overflow-hidden">
            <table class="min-w-full text-sm">
                <thead class="bg-gray-100">
                    <tr class="border-b">
                        <th class="p-3 text-center font-semibold">Order</th>
                        <th class="p-3 text-left font-semibold">Task Code</th>
                        <th class="p-3 text-left font-semibold">Task Dependency</th>
                        <th class="p-3 text-left font-semibold">Task Description</th>
                        <th class="p-3 text-center font-semibold">Priority</th>
                        <th class="p-3 text-center font-semibold">Status</th>
                        <th class="p-3 text-center font-semibold">Story Point</th>
                        <th class="p-3 text-center font-semibold">Days Spent</th>
                    </tr>
                </thead>
                <tbody>
                    ${taskRows}
                </tbody>
            </table>
        </div>
    `;
    
    // Add drag and drop event listeners
    const tbody = container.querySelector('tbody');
    if (tbody) {
        tbody.addEventListener('dragstart', handleDragStart);
        tbody.addEventListener('dragover', handleDragOver);
        tbody.addEventListener('dragend', handleDragEnd);
        tbody.addEventListener('drop', handleDrop);
    }
}

// --- Initial Load ---
window.addEventListener('DOMContentLoaded', () => {
    initializeAssigneeFilter();
    renderPage();
    toggleSubmenu('sprint-submenu');
    document.addEventListener('click', e => {
        if (!e.target.closest('#assignee-filter-container .relative')) {
            closeAllFilterDropdowns();
        }
    });
});

</script>

</body>

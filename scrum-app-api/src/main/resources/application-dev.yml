spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/scrum_app_dev}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    clean-disabled: false # Allow clean in dev for testing

logging:
  level:
    com.scrumku.scrumapp: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    root: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# JWT Configuration for Dev
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24 hours
  refresh-expiration: 604800000 # 7 days

# CORS Configuration for Dev
cors:
  allowed-origins: http://localhost:4200,http://127.0.0.1:4200
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
  allowed-headers: "*"
  allow-credentials: true

# Project Key Configuration for Dev
project:
  key:
    master-key: ${PROJECT_KEY_MASTER_KEY}
    expiration-days: ${PROJECT_KEY_EXPIRATION_DAYS:30}
    length: ${PROJECT_KEY_LENGTH:8}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks - Assignee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .sidebar {
            transition: transform 0.3s ease-in-out;
        }
        .sidebar.mobile-hidden {
            transform: translateX(-100%);
        }
        .sidebar-overlay {
            transition: opacity 0.3s ease-in-out;
        }
        .sidebar-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        @media (min-width: 768px) {
            .sidebar.mobile-hidden {
                transform: translateX(0);
            }
        }
        .task-card {
            transition: all 0.3s ease;
        }
        .task-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px -5px rgba(0, 0, 0, 0.1), 0 4px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .custom-dropdown-panel {
            display: none;
            position: absolute;
            z-index: 50;
            min-width: 100%;
            max-height: 250px;
            overflow-y: auto;
            background-color: white;
            border: 1px solid #e5e7eb;
            border-radius: 0.375rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        .custom-dropdown-panel.show { display: block; }
        .custom-dropdown-option { padding: 8px 12px; cursor: pointer; font-size: 0.875rem; }
        .custom-dropdown-option:hover { background-color: #f3f4f6; }
        .status-badge, .priority-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 10pt;
        }
    </style>
</head>
<body class="bg-blue-50">

    <div class="flex h-screen bg-gray-100">
        <!-- Mobile Overlay -->
        <div id="sidebar-overlay" class="sidebar-overlay fixed inset-0 bg-black bg-opacity-50 z-40 md:hidden hidden"></div>
        
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar fixed md:relative w-64 flex-shrink-0 bg-white border-r border-gray-200 flex flex-col h-screen z-50 md:z-auto">
            <!-- Sidebar Header (Sticky) -->
            <div class="h-16 flex items-center justify-between px-4 border-b border-gray-200 flex-shrink-0 bg-white sticky top-0 z-10">
                <div>
                    <h1 class="text-lg font-bold text-gray-800">Scrum Board</h1>
                    <p class="text-xs text-gray-500">Sprint 1 - E-commerce Platform</p>
                </div>
                <button id="mobile-close-btn" class="md:hidden text-gray-500 hover:text-gray-700">
                    <i class="fa-solid fa-times text-2xl"></i>
                </button>
            </div>

            <!-- Navigation (Scrollable) -->
            <div class="flex-1 overflow-y-auto">
                <nav class="px-4 py-6 space-y-2">
                    <a href="assignee-dashboard.html" class="flex items-center px-4 py-2.5 text-sm font-semibold text-gray-600 hover:bg-blue-50 hover:text-blue-700 rounded-lg">
                        <i class="fa-solid fa-table-columns w-6 text-center"></i>
                        <span>Dashboard</span>
                    </a>
                    <a href="assignee-my-tasks.html" class="flex items-center px-4 py-2.5 text-sm font-semibold text-white bg-blue-600 rounded-lg">
                        <i class="fa-solid fa-tasks w-6 text-center"></i>
                        <span>My Tasks</span>
                    </a>
                    <a href="assignee-timeline.html" class="flex items-center px-4 py-2.5 text-sm font-semibold text-gray-600 hover:bg-blue-50 hover:text-blue-700 rounded-lg">
                        <i class="fa-solid fa-calendar-days w-6 text-center"></i>
                        <span>Timeline</span>
                    </a>
                    <a href="assignee-sprint-list.html" class="flex items-center px-4 py-2.5 text-sm font-semibold text-gray-600 hover:bg-blue-50 hover:text-blue-700 rounded-lg">
                        <i class="fa-solid fa-exchange-alt w-6 text-center"></i>
                        <span>Switch Sprint</span>
                    </a>
                </nav>
            </div>

            <!-- Sidebar Footer (Sticky) -->
            <div class="p-4 border-t border-gray-200 flex-shrink-0 bg-white sticky bottom-0 z-10">
                <a href="../login.html" class="flex items-center px-4 py-2.5 text-sm font-semibold text-gray-600 hover:bg-blue-50 hover:text-blue-700 rounded-lg">
                    <i class="fa-solid fa-sign-out-alt w-6 text-center"></i>
                    <span>Logout</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto md:ml-0">
            <!-- Header -->
            <header class="bg-white shadow-sm sticky top-0 z-30">
                <div class="flex justify-between items-center p-4 sm:p-6">
                    <div class="flex items-center">
                        <button id="mobile-menu-btn" class="md:hidden mr-4 text-gray-600 hover:text-gray-800">
                            <i class="fa-solid fa-bars text-lg"></i>
                        </button>
                        <h2 class="text-2xl font-bold text-gray-800">My Tasks</h2>
                    </div>
                    <div class="flex items-center">
                        <div class="relative">
                            <!-- Desktop: Full user info in navbar -->
                            <button id="user-avatar-btn" class="flex items-center space-x-2 text-sm text-gray-600 hover:text-gray-800">
                                <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center text-white font-semibold">
                                    JD
                                </div>
                                <div class="hidden md:block">
                                    <div class="text-sm font-medium text-gray-800">John Doe</div>
                                    <div class="text-xs text-gray-500">john.doe@email.com</div>
                                </div>
                                <i class="fa-solid fa-chevron-down text-xs"></i>
                            </button>
                            
                            <!-- Avatar Dropdown -->
                            <div id="avatar-dropdown" class="hidden absolute right-0 mt-2 w-56 bg-white rounded-md shadow-lg py-1 z-50 border border-gray-200">
                                <!-- Mobile: User info in dropdown -->
                                <div class="md:hidden px-4 py-2 border-b border-gray-200">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center text-white font-semibold text-sm">
                                            JD
                                        </div>
                                        <div>
                                            <div class="text-sm font-medium text-gray-800">John Doe</div>
                                            <div class="text-xs text-gray-500">john.doe@email.com</div>
                                        </div>
                                    </div>
                                </div>
                                
                                <a href="#" class="block px-4 py-2 text-sm text-gray-500 hover:bg-gray-100 cursor-not-allowed">
                                    <i class="fa-solid fa-cog mr-2"></i>Settings
                                </a>
                                <a href="../login.html" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                                    <i class="fa-solid fa-sign-out-alt mr-2"></i>Logout
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Content Area -->
            <div class="p-4 sm:p-6 lg:p-8">
                
                <!-- Task Cards Grid -->
                <div id="tasks-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Task cards will be dynamically generated here -->
                </div>

                <!-- Empty State -->
                <div id="empty-state" class="hidden text-center py-12">
                    <div class="max-w-md mx-auto">
                        <i class="fa-solid fa-tasks text-6xl text-gray-300 mb-4"></i>
                        <h3 class="text-xl font-semibold text-gray-800 mb-2">No Tasks Assigned</h3>
                        <p class="text-gray-600">
                            You don't have any tasks assigned to you in this sprint yet.
                        </p>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        // Mobile sidebar functionality
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileCloseBtn = document.getElementById('mobile-close-btn');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');

        function openSidebar() {
            sidebar.classList.remove('mobile-hidden');
            sidebarOverlay.classList.remove('hidden');
        }

        function closeSidebar() {
            sidebar.classList.add('mobile-hidden');
            sidebarOverlay.classList.add('hidden');
        }

        // Check if screen is mobile size
        function isMobile() {
            return window.innerWidth < 768; // md breakpoint
        }

        // Handle window resize
        function handleResize() {
            if (!isMobile()) {
                // Desktop: always show sidebar, remove mobile classes
                sidebar.classList.remove('mobile-hidden');
                sidebarOverlay.classList.add('hidden');
            } else {
                // Mobile: hide sidebar by default
                sidebar.classList.add('mobile-hidden');
                sidebarOverlay.classList.add('hidden');
            }
        }

        mobileMenuBtn.addEventListener('click', openSidebar);
        mobileCloseBtn.addEventListener('click', closeSidebar);
        sidebarOverlay.addEventListener('click', closeSidebar);
        
        // Handle window resize
        window.addEventListener('resize', handleResize);
        
        // Initialize sidebar state
        handleResize();

        // Avatar dropdown functionality
        const avatarBtn = document.getElementById('user-avatar-btn');
        const avatarDropdown = document.getElementById('avatar-dropdown');

        avatarBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            avatarDropdown.classList.toggle('hidden');
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!avatarBtn.contains(e.target) && !avatarDropdown.contains(e.target)) {
                avatarDropdown.classList.add('hidden');
            }
        });

        // Mock data for tasks
        const mockTasks = [
            {
                id: 1,
                code: 'MBAP-T-01',
                description: 'Setup project structure and basic boilerplate',
                priority: 'high',
                status: 'done',
                storyPoints: 5,
                department: 'Frontend',
                dependency: null,
                order: 1
            },
            {
                id: 2,
                code: 'MBAP-T-02',
                description: 'Develop the main dashboard component with responsive design',
                priority: 'high',
                status: 'in_progress',
                storyPoints: 8,
                department: 'Frontend',
                dependency: 'MBAP-T-01',
                order: 2
            },
            {
                id: 3,
                code: 'MBAP-T-03',
                description: 'Implement user authentication flow and login system',
                priority: 'medium',
                status: 'in_progress',
                storyPoints: 6,
                department: 'Frontend',
                dependency: null,
                order: 3
            },
            {
                id: 4,
                code: 'MBAP-T-04',
                description: 'Create reusable UI components library',
                priority: 'medium',
                status: 'todo',
                storyPoints: 4,
                department: 'Frontend',
                dependency: 'MBAP-T-02',
                order: 4
            },
            {
                id: 5,
                code: 'MBAP-T-05',
                description: 'Optimize application performance and bundle size',
                priority: 'low',
                status: 'todo',
                storyPoints: 3,
                department: 'Frontend',
                dependency: 'MBAP-T-04',
                order: 5
            },
            {
                id: 6,
                code: 'MBAP-T-06',
                description: 'Write comprehensive unit tests for components',
                priority: 'medium',
                status: 'closed',
                storyPoints: 7,
                department: 'Frontend',
                dependency: null,
                order: 6
            }
        ];

        // Status and priority configurations
        const statusConfig = {
            'todo': { name: 'To Do', color: 'gray', bg: 'bg-gray-100', text: 'text-gray-700' },
            'in_progress': { name: 'In Progress', color: 'blue', bg: 'bg-blue-100', text: 'text-blue-700' },
            'done': { name: 'Done', color: 'green', bg: 'bg-green-100', text: 'text-green-700' },
            'closed': { name: 'Closed', color: 'red', bg: 'bg-red-100', text: 'text-red-700' }
        };

        const priorityConfig = {
            'high': { name: 'High', color: 'red', bg: 'bg-red-100', text: 'text-red-700' },
            'medium': { name: 'Medium', color: 'orange', bg: 'bg-orange-100', text: 'text-orange-700' },
            'low': { name: 'Low', color: 'green', bg: 'bg-green-100', text: 'text-green-700' }
        };

        // Available status options for assignee (excluding CLOSED)
        const availableStatuses = ['todo', 'in_progress', 'done'];

        // Helper function to get badge HTML
        function getBadge(type, value) {
            const config = type === 'status' ? statusConfig[value] : priorityConfig[value];
            if (!config) return '';
            return `<span class="${type}-badge ${config.bg} ${config.text}">${config.name}</span>`;
        }

        // Build status dropdown
        function buildStatusDropdown(taskId, currentStatus) {
            const options = availableStatuses.map(status => {
                const config = statusConfig[status];
                const isSelected = status === currentStatus ? 'bg-blue-50 text-blue-700 border-blue-200' : 'hover:bg-gray-50';
                return `<li class="custom-dropdown-option ${isSelected} border-l-2 ${isSelected ? 'border-blue-400' : 'border-transparent'}" onclick="updateTaskStatus('${taskId}', '${status}')">
                    <div class="flex items-center">
                        <span class="status-badge ${config.bg} ${config.text}">${config.name}</span>
                    </div>
                </li>`;
            }).join('');

            const currentConfig = statusConfig[currentStatus];
            const currentIcon = currentStatus === 'todo' ? 'fa-circle' : currentStatus === 'in_progress' ? 'fa-play' : 'fa-check-circle';

            return `
                <div class="custom-dropdown relative">
                    <div class="dropdown-trigger cursor-pointer flex items-center justify-center px-4 py-2 md:px-6 md:py-3 bg-white border border-gray-300 rounded-lg hover:border-blue-400 hover:shadow-sm transition-all duration-200 w-[150px] md:w-[180px]" onclick="toggleDropdown(event, this)">
                        <span class="status-badge ${currentConfig.bg} ${currentConfig.text} text-xs md:text-sm font-semibold">${currentConfig.name}</span>
                        <i class="fa-solid fa-chevron-down text-xs ml-2 md:ml-3 text-gray-400"></i>
                    </div>
                    <div class="custom-dropdown-panel">
                        <ul>${options}</ul>
                    </div>
                </div>
            `;
        }

        // Toggle dropdown
        function toggleDropdown(event, trigger) {
            event.stopPropagation();
            const panel = trigger.nextElementSibling;
            const isShowing = panel.classList.contains('show');
            
            // Close all other dropdowns
            document.querySelectorAll('.custom-dropdown-panel.show').forEach(p => p.classList.remove('show'));
            
            if (!isShowing) {
                panel.classList.add('show');
            }
        }

        // Update task status
        function updateTaskStatus(taskId, newStatus) {
            const task = mockTasks.find(t => t.id == taskId);
            if (task) {
                task.status = newStatus;
                renderTasks();
            }
            
            // Close all dropdowns
            document.querySelectorAll('.custom-dropdown-panel.show').forEach(p => p.classList.remove('show'));
        }

        // Render task cards
        function renderTasks() {
            const container = document.getElementById('tasks-container');
            const emptyState = document.getElementById('empty-state');
            
            // Filter out closed tasks for assignees
            const visibleTasks = mockTasks.filter(task => task.status !== 'closed');
            
            if (visibleTasks.length === 0) {
                container.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            container.classList.remove('hidden');
            emptyState.classList.add('hidden');

            // Sort tasks by order
            const sortedTasks = [...visibleTasks].sort((a, b) => a.order - b.order);

            container.innerHTML = sortedTasks.map(task => `
                <div class="task-card bg-white rounded-xl shadow-sm p-6 border-l-4 ${task.status === 'done' ? 'border-green-500' : task.status === 'in_progress' ? 'border-blue-500' : 'border-gray-300'}">
                    <!-- Header Section -->
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex-1">
                            <h3 class="font-bold text-gray-800 mb-1">${task.code}</h3>
                            <p class="text-sm text-gray-600 line-clamp-2">${task.description}</p>
                        </div>
                        <div class="ml-4">
                            ${getBadge('priority', task.priority)}
                        </div>
                    </div>
                    
                    <!-- Prominent Status Section -->
                    <div class="bg-gray-50 rounded-lg p-4 mb-4 border border-gray-200">
                        <div class="flex justify-center">
                            ${buildStatusDropdown(task.id, task.status)}
                        </div>
                    </div>
                    
                    <!-- Task Details Section -->
                    <div class="space-y-3 md:space-y-3">
                        <!-- Row 1: Story Points and Department -->
                        <div class="grid grid-cols-2 gap-2 md:gap-3">
                            <div class="bg-gray-50 rounded-lg p-2 md:p-3 text-center border border-gray-200">
                                <div class="text-base md:text-lg font-bold text-gray-800 mb-1">${task.storyPoints}</div>
                                <div class="text-xs md:text-xs text-gray-500">Story Points</div>
                            </div>
                            <div class="bg-gray-50 rounded-lg p-2 md:p-3 text-center border border-gray-200">
                                <div class="text-base md:text-lg font-bold text-gray-800 mb-1">${task.department}</div>
                                <div class="text-xs md:text-xs text-gray-500">Department</div>
                            </div>
                        </div>
                        
                        <!-- Row 2: Dependency and Order -->
                        <div class="grid grid-cols-2 gap-2 md:gap-3">
                            ${task.dependency ? `
                            <div class="bg-gray-50 rounded-lg p-2 md:p-3 text-center border border-gray-200">
                                <div class="text-base md:text-lg font-bold text-gray-800 mb-1">${task.dependency}</div>
                                <div class="text-xs md:text-xs text-gray-500">Dependency</div>
                            </div>
                            ` : `
                            <div class="bg-gray-50 rounded-lg p-2 md:p-3 text-center border border-gray-200">
                                <div class="text-base md:text-lg font-bold text-gray-800 mb-1">-</div>
                                <div class="text-xs md:text-xs text-gray-500">Dependency</div>
                            </div>
                            `}
                            <div class="bg-gray-50 rounded-lg p-2 md:p-3 text-center border border-gray-200">
                                <div class="text-base md:text-lg font-bold text-gray-800 mb-1">${task.order}</div>
                                <div class="text-xs md:text-xs text-gray-500">Order</div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Close dropdowns when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.custom-dropdown')) {
                document.querySelectorAll('.custom-dropdown-panel.show').forEach(p => p.classList.remove('show'));
            }
        });

        // Initialize page
        document.addEventListener('DOMContentLoaded', () => {
            // Check if sprint is selected
            const selectedSprintId = localStorage.getItem('selectedSprintId');
            if (!selectedSprintId) {
                // Redirect to sprint selection if no sprint is selected
                window.location.href = 'assignee-sprint-list.html';
            }
            
            renderTasks();
        });
    </script>

</body>
</html>

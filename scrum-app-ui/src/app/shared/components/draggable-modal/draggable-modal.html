@if (isVisible()) {
  <div 
    class="fixed inset-0 bg-gray-600/50 overflow-y-auto h-full w-full z-50"
    (click)="onBackdropClick()">
    
    <div 
      [class]="modalClasses()"
      cdkDrag
      cdkDragBoundary="body"
      (click)="onModalClick($event)"
      (cdkDragStarted)="onDragStarted()"
      (cdkDragEnded)="onDragEnded()">
      
      <!-- Fixed Header -->
      <div class="flex items-center justify-between px-6 py-2 border-b border-gray-200 bg-gray-50 rounded-t-xl flex-shrink-0">
        <!-- Title Section with Icon -->
        <div class="flex items-center space-x-3">
          <i class="fa-regular fa-pen-to-square text-gray-600 text-lg"></i>
          <div>
            <h3 class="text-lg font-semibold text-gray-900">{{ title() }}</h3>
            @if (subtitle()) {
              <p class="text-sm text-gray-600 mt-0.5">{{ subtitle() }}</p>
            }
          </div>
        </div>
        
        <!-- Close Button -->
        <button 
          type="button" 
          (click)="onClose.emit()"
          class="text-gray-400 pt-2 pb-2 cursor-pointer">
          <i class="fa-solid fa-xmark text-3xl"></i>
        </button>
      </div>
      
      <!-- Scrollable Content Area -->
      <div class="flex-1 overflow-y-auto">
        <div class="pt-6 pr-6 pl-6">
          <ng-content></ng-content>
        </div>
      </div>
      
    </div>
  </div>
}

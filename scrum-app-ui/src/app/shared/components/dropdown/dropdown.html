<div class="custom-dropdown">
  <div 
    #trigger
    class="dropdown-trigger cursor-pointer"
    [class.pointer-events-none]="isDisabled()"
    [class.opacity-50]="isDisabled()"
    (click)="toggleDropdown()">
    <ng-content></ng-content>
  </div>
  
  <!-- CDK Overlay Template -->
  <ng-template #dropdownPanel>
    <div class="bg-white border border-gray-300 rounded-md shadow-lg max-h-60 overflow-y-auto min-w-full">
      @if (config().isSearchable) {
        <div class="p-2 border-b border-gray-200">
          <input 
            type="text" 
            class="w-full px-2 py-1 border border-gray-300 rounded-md text-sm" 
            placeholder="Search..." 
            (input)="onSearchInput($event)"
            (click)="$event.stopPropagation()">
        </div>
      }
      
      <ul>
        @for (option of filteredOptions(); track option.id) {
          <li 
            class="custom-dropdown-option"
            (click)="selectOption(option)">
            @if (option.badgeClass) {
              <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium" [class]="option.badgeClass">
                {{ option.displayName || option.name }}
              </span>
            } @else if (option.id === null) {
              <span class="text-gray-500">{{ option.displayName || option.name }}</span>
            } @else {
              {{ option.displayName || option.name }}
            }
          </li>
        }
      </ul>
    </div>
  </ng-template>
</div>

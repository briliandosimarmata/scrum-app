<!-- User Menu Widget -->
<div class="user-menu-container relative">
  <button (click)="toggleUserMenu()" 
          class="flex items-center space-x-3 p-2 rounded-lg hover:bg-gray-50 transition-colors">
    <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center">
      <span class="text-sm font-medium text-blue-600">
        {{ getInitials() }}
      </span>
    </div>
    <div class="hidden md:block text-left">
      <p class="text-sm font-medium text-gray-900">{{ currentUser()?.firstName }} {{ currentUser()?.lastName }}</p>
      <p class="text-xs text-gray-500">{{ currentUser()?.email }}</p>
    </div>
    <i class="fa-solid fa-chevron-down text-xs text-gray-400"></i>
  </button>

  <!-- Dropdown Menu -->
  @if (showUserMenu()) {
    <div class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-50 border border-gray-200">
      <div class="px-4 py-2 border-b border-gray-100">
        <p class="text-sm font-medium text-gray-900">{{ currentUser()?.firstName }} {{ currentUser()?.lastName }}</p>
        <p class="text-xs text-gray-500">{{ currentUser()?.email }}</p>
      </div>
      <button class="block w-full text-left px-4 py-2 text-sm text-gray-400 cursor-not-allowed"
              disabled
              title="Profile - Coming Soon">
        <i class="fa-solid fa-user mr-2"></i>Profile
      </button>
      <button class="block w-full text-left px-4 py-2 text-sm text-gray-400 cursor-not-allowed"
              disabled
              title="Settings - Coming Soon">
        <i class="fa-solid fa-cog mr-2"></i>Settings
      </button>
      <div class="border-t border-gray-100"></div>
      <button (click)="logout()" 
              class="block w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors">
        <i class="fa-solid fa-sign-out-alt mr-2"></i>Logout
      </button>
    </div>
  }
</div>

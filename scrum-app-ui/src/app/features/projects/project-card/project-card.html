<div class="relative bg-white rounded-xl shadow-md overflow-hidden transform hover:-translate-y-1 transition-transform duration-300 ease-in-out group h-80 sm:h-72 lg:h-80 xl:h-80 flex flex-col">
  <!-- Edit/Delete Buttons -->
  <div class="absolute top-2 right-2 flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity duration-200 z-10">
    <button 
      (click)="onEditProject($event)"
      class="edit-project-btn w-8 h-8 rounded-full bg-blue-100 hover:bg-blue-200 text-blue-600 hover:text-blue-700 shadow-sm flex items-center justify-center transition-all duration-200 cursor-pointer"
      [title]="'Edit Project'">
      <i class="fas fa-edit text-xs"></i>
    </button>
    <button 
      (click)="onDeleteProject($event)"
      class="delete-project-btn w-8 h-8 rounded-full bg-red-100 hover:bg-red-200 text-red-600 hover:text-red-700 shadow-sm flex items-center justify-center transition-all duration-200 cursor-pointer"
      [title]="'Delete Project'">
      <i class="fas fa-trash text-xs"></i>
    </button>
  </div>
  
      <a [routerLink]="['/projects', project().code]" class="block cursor-pointer flex flex-col h-full">
        <img
          class="h-32 sm:h-28 lg:h-32 xl:h-32 w-full object-cover flex-shrink-0"
          [src]="project().thumbnailUrl"
          [alt]="'Project Thumbnail'"
          (error)="onImageError($event)">
        <div class="p-4 sm:p-5 lg:p-6 flex flex-col flex-grow">
          <div class="flex items-center justify-between mb-2 flex-shrink-0">
            <h3 class="text-lg font-bold text-gray-800 truncate pr-2">{{ project().name }}</h3>
            <span class="text-xs font-medium text-blue-600 bg-blue-100 px-2 py-1 rounded flex-shrink-0">{{ project().code }}</span>
          </div>
          <p class="text-gray-600 text-sm line-clamp-3 flex-grow">
            {{ project().description }}
          </p>
        </div>
      </a>
</div>

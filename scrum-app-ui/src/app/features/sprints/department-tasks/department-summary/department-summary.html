<div class="bg-white rounded-xl shadow-sm p-5 mb-6">
  <h3 class="text-lg font-semibold text-gray-800 mb-4">{{ departmentData().departmentName }} - Sprint Summary</h3>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-center">
    <div class="bg-blue-100 p-4 rounded-lg">
      <p class="text-sm text-blue-700 font-medium">Total Story Points</p>
      <p class="text-2xl font-bold text-blue-900">{{ departmentData().totalStoryPoints }}</p>
    </div>
    <div class="bg-green-100 p-4 rounded-lg">
      <p class="text-sm text-green-700 font-medium">Total Team's Capacity Left</p>
      <p class="text-2xl font-bold text-green-900">{{ departmentData().totalTeamCapacityLeft }} SP</p>
    </div>
  </div>
</div>

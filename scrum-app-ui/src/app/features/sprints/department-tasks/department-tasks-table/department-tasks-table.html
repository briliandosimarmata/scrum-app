<div class="bg-white rounded-xl shadow-sm overflow-hidden">
  <table class="min-w-full text-sm border-collapse">
    <thead class="bg-gray-100">
      <tr class="border-b border-gray-300">
        <th class="p-3 text-left font-semibold">Task Code</th>
        <th class="p-3 text-left font-semibold">Task Description</th>
        <th class="p-3 text-left font-semibold">Assignee</th>
        <th class="p-3 text-center font-semibold">Priority</th>
        <th class="p-3 text-center font-semibold">Story Point</th>
        <th class="p-3 text-center font-semibold">Days Spent</th>
      </tr>
    </thead>
    <tbody>
      @for (task of departmentData().tasks; track task.taskId) {
        <tr class="border-b border-gray-300">
          <td class="p-3">{{ task.taskCode }}</td>
          <td class="p-3">{{ task.description }}</td>
          <td class="p-3">{{ task.assigneeName }}</td>
          <td class="p-3 text-center">
            <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium {{ getPriorityBadgeClass(task.priority) }}" style="font-size: 8pt;">
              {{ getPriorityDisplayName(task.priority) }}
            </span>
          </td>
          <td class="p-3 text-center">{{ task.storyPoints }}</td>
          <td class="p-3 text-center">{{ task.daysSpent }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>

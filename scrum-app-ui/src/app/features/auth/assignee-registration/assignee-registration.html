<div class="bg-blue-50 min-h-screen flex flex-col">
  <main class="flex-1 flex items-center justify-center p-4 sm:p-6 lg:p-8">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <div class="bg-blue-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
          <i class="fa-solid fa-user-plus text-2xl text-blue-600"></i>
        </div>
        <h2 class="text-2xl font-bold text-gray-800 mb-2">Register as Assignee</h2>
        <p class="text-gray-600">Join a project as a team member to start working on tasks.</p>
      </div>

      <div class="bg-white rounded-xl shadow-lg p-8">
        <div class="space-y-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
            <input type="email" class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                   placeholder="Enter your email address" [value]="email()" (input)="email.set(($any($event.target)).value)">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
            <input type="password" class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                   placeholder="Enter your password" [value]="password()" (input)="password.set(($any($event.target)).value)">
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Assignee Code</label>
            <input type="text" class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 uppercase"
                   placeholder="Enter assignee code" [value]="assigneeCode()" (input)="onInputUppercaseAssignee($event)">
            <div class="text-xs text-gray-500 mt-1">Get this code from your project manager</div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Project Secret Key</label>
            <input type="text" class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                   placeholder="Enter project secret key" [value]="projectKey()" (input)="projectKey.set(($any($event.target)).value)">
            <div class="text-xs text-gray-500 mt-1">Get this key from your project manager</div>
          </div>

          @if (error()) {
            <div class="p-3 rounded-lg bg-red-50 border border-red-200 text-sm text-red-700">{{ error() }}</div>
          }
          @if (success()) {
            <div class="p-3 rounded-lg bg-green-50 border border-green-200 text-sm text-green-700">Registration successful! Redirecting...</div>
          }

          <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-60 disabled:cursor-not-allowed"
                  [disabled]="isSubmitting()" (click)="submit()">
            <span *ngIf="!isSubmitting()">Register as Assignee</span>
            <span *ngIf="isSubmitting()"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Registering...</span>
          </button>
        </div>
      </div>

      <div class="text-center mt-6">
        <a [routerLink]="['/auth/login']" class="text-blue-600 hover:text-blue-500 font-medium flex items-center justify-center mt-2">
          <i class="fa-solid fa-arrow-left mr-2"></i>
          Back to Login
        </a>
      </div>
    </div>
  </main>
  
</div>

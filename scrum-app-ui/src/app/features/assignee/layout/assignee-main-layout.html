<div class="flex h-screen bg-gray-100">
  <!-- Mobile Overlay -->
  @if (isSidebarOpen()) {
    <div 
      class="fixed inset-0 bg-black opacity-50 z-40 md:hidden transition-opacity duration-300 ease-in-out"
      (click)="closeSidebar()">
    </div>
  }
  
  <!-- Sidebar -->
  <aside 
    [class.translate-x-0]="isSidebarOpen()"
    [class.-translate-x-full]="!isSidebarOpen()"
    class="fixed md:relative w-64 flex-shrink-0 bg-white border-r border-gray-200 flex flex-col h-screen z-50 md:z-auto transition-transform duration-300 ease-in-out md:translate-x-0">
    
    <!-- Sidebar Header (Sticky) -->
    <div class="h-20 sm:h-17 flex items-center justify-between px-4 border-b border-gray-200 flex-shrink-0 bg-white sticky top-0 z-10">
      <div class="flex-1 min-w-0">
        <h1 class="text-lg font-bold text-gray-800 truncate">Scrum Board</h1>
        <p class="text-xs text-gray-500 truncate">{{ sprintDisplayName() }}</p>
      </div>
      <button 
        class="md:hidden text-gray-500 hover:text-gray-700 ml-2 flex-shrink-0"
        (click)="closeSidebar()">
        <i class="fa-solid fa-times text-2xl"></i>
      </button>
    </div>

    <!-- Navigation (Scrollable) -->
    <div class="flex-1 overflow-y-auto">
      <nav class="px-4 py-6 space-y-2">
        <a 
          routerLink="dashboard" 
          routerLinkActive="!bg-blue-600 !text-white hover:!bg-blue-700"
          [routerLinkActiveOptions]="{exact: false}"
          class="flex items-center px-4 py-2.5 text-sm font-semibold text-gray-600 hover:bg-blue-50 hover:text-blue-700 rounded-lg transition-colors duration-200"
          (click)="closeSidebar()">
          <i class="fa-solid fa-table-columns w-6 text-center"></i>
          <span>Dashboard</span>
        </a>
        <a 
          routerLink="my-tasks" 
          routerLinkActive="!bg-blue-600 !text-white hover:!bg-blue-700"
          [routerLinkActiveOptions]="{exact: false}"
          class="flex items-center px-4 py-2.5 text-sm font-semibold text-gray-600 hover:bg-blue-50 hover:text-blue-700 rounded-lg transition-colors duration-200"
          (click)="closeSidebar()">
          <i class="fa-solid fa-tasks w-6 text-center"></i>
          <span>My Tasks</span>
        </a>
        <a 
          routerLink="timeline" 
          routerLinkActive="!bg-blue-600 !text-white hover:!bg-blue-700"
          [routerLinkActiveOptions]="{exact: false}"
          class="flex items-center px-4 py-2.5 text-sm font-semibold text-gray-600 hover:bg-blue-50 hover:text-blue-700 rounded-lg transition-colors duration-200"
          (click)="closeSidebar()">
          <i class="fa-solid fa-calendar-days w-6 text-center"></i>
          <span>Timeline</span>
        </a>
        <button 
          (click)="navigateToSprints()"
          class="w-full flex items-center px-4 py-2.5 text-sm font-semibold text-gray-600 hover:bg-blue-50 hover:text-blue-700 rounded-lg transition-colors">
          <i class="fa-solid fa-exchange-alt w-6 text-center"></i>
          <span>Switch Sprint</span>
        </button>
      </nav>
    </div>

    <!-- Sidebar Footer (Sticky) -->
    <div class="p-4 border-t border-gray-200 flex-shrink-0 bg-white sticky bottom-0 z-10">
      <a 
        routerLink="/auth/login"
        (click)="closeSidebar()"
        class="w-full flex items-center px-4 py-2.5 text-sm font-semibold text-gray-600 hover:bg-blue-50 hover:text-blue-700 rounded-lg transition-colors">
        <i class="fa-solid fa-sign-out-alt w-6 text-center"></i>
        <span>Logout</span>
      </a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto md:ml-0">
    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-30">
      <div class="flex justify-between items-center p-4 sm:py-2 sm:px-6">
        <div class="flex items-center">
          <button 
            class="md:hidden mr-4 text-gray-600 hover:text-gray-800"
            (click)="toggleSidebar()">
            <i class="fa-solid fa-bars text-lg"></i>
          </button>
          <h2 class="text-2xl font-bold text-gray-800">{{ pageTitle() }}</h2>
        </div>
        
        <div class="flex items-center">
          <app-user-menu-widget></app-user-menu-widget>
        </div>
      </div>
    </header>

    <!-- Content Area -->
    <div class="p-4 sm:p-6 lg:p-8">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
